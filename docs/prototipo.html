<title>Aulas de Canto IMCM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: barra de marca + abas; cada aba é uma tela do app real (mobile-first, coluna única até 900px) */
:root{--bg:#EEECE7;--surface:#FFFFFF;--ink:#161616;--muted:#6B6A66;--line:#DDDAD3;--navy:#0C1E3C;--red:#E1251B;
--ok:#1E7A4C;--ok-bg:#E3F2EA;--warn:#A85A00;--warn-bg:#FCEFD9;--ex:#4A5A75;--ex-bg:#E6EAF1;--bad:#B3261E;
--font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111214;--surface:#1B1C1F;--ink:#EDECE8;--muted:#9C9A94;--line:#2E2F33;--navy:#9FB6DD;--red:#FF4B3E;
--ok:#5FD39A;--ok-bg:#163126;--warn:#F2B35B;--warn-bg:#36280F;--ex:#A9B8D3;--ex-bg:#222A38;--bad:#FF7A70;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111214;--surface:#1B1C1F;--ink:#EDECE8;--muted:#9C9A94;--line:#2E2F33;--navy:#9FB6DD;--red:#FF4B3E;
--ok:#5FD39A;--ok-bg:#163126;--warn:#F2B35B;--warn-bg:#36280F;--ex:#A9B8D3;--ex-bg:#222A38;--bad:#FF7A70;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:18px 10px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-size:22px;font-weight:800;letter-spacing:-.03em}
.brand b i{color:var(--red);font-style:normal}
.brand span{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.proto{margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--red);border:1px solid var(--red);border-radius:99px;padding:3px 10px}
nav{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:20px}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
nav button[aria-current="true"]{color:var(--ink);border-color:var(--red)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px}
.mpick{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px}
.mpick button{border:0;background:none;width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:18px}
.mpick button:hover{background:var(--bg)}
.mpick strong{min-width:130px;text-align:center;font-size:16px;text-transform:capitalize}
h2{font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:28px 0 10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px}
.kpi small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.kpi strong{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.kpi em{font-style:normal;font-size:12px;color:var(--muted)}
.neg{color:var(--bad)}.pos{color:var(--ok)}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:14px 0 4px;display:flex}
.progress i{display:block;background:var(--ok)}
.progress i+i{background:var(--ex)}
.legend{font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.legend b{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.row{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.who{min-width:0}
.who b{font-weight:600}
.who small{display:block;color:var(--muted);font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 11px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on.pago{background:var(--ok-bg);color:var(--ok)}
.seg button.on.pendente{background:var(--warn-bg);color:var(--warn)}
.seg button.on.isento{background:var(--ex-bg);color:var(--ex)}
.detail{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600;color:var(--ink);cursor:pointer}
.chip.on{background:var(--navy);border-color:var(--navy);color:var(--surface)}
.chip.flag{border-color:var(--warn);color:var(--warn);background:var(--warn-bg)}
input,select{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:9px;padding:9px 14px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.filters{display:flex;gap:6px;margin-left:auto}
.grid-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 10px;text-align:left;font-size:13px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
td.num,th.num{text-align:right}
.cell{display:inline-block;width:22px;height:22px;border-radius:6px;vertical-align:middle;text-align:center;line-height:22px;font-size:11px;font-weight:700}
.c-pago{background:var(--ok-bg);color:var(--ok)}.c-pendente{background:var(--warn-bg);color:var(--warn)}.c-isento{background:var(--ex-bg);color:var(--ex)}.c-x{background:transparent;color:var(--line)}
.chart{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;align-items:end;height:150px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 14px 0}
.col{display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative}
.col i{display:block;background:var(--ok);border-radius:3px 3px 0 0}
.col i.p{background:var(--warn);border-radius:3px 3px 0 0}
.col i.p+i{border-radius:0}
.col span{font-size:10px;color:var(--muted);text-align:center;padding:4px 0 8px;text-transform:capitalize}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:720px){.two{grid-template-columns:1fr}}
.note{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--muted)}
.paper{background:#fff;color:#161616;max-width:760px;margin:0 auto;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.12);padding:40px 44px}
.paper h3{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:#6B6A66;margin:26px 0 8px}
.paper table td,.paper table th{border-color:#E5E2DC;color:#161616}
.paper .tag{font-size:11px;font-weight:700;color:#A85A00}
.ph{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #161616;padding-bottom:12px;gap:12px;flex-wrap:wrap}
.ph b{font-size:22px;font-weight:800;letter-spacing:-.03em}.ph b i{color:#E1251B;font-style:normal}
@media (max-width:600px){.paper{padding:24px 18px}}
.qa{display:grid;gap:10px}
.qa div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.qa b{display:block;margin-bottom:2px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

function nextM(m){let[y,mm]=m.split('-').map(Number);mm++;if(mm>12){mm=1;y++}return y+'-'+String(mm).padStart(2,'0')}
function vAno(){const ms=meses().filter(m=>m.startsWith(ano));const Rs=ms.map(resumo);
 const t=k=>Rs.reduce((s,r)=>s+(r[k]||0),0);const nfKnown=Rs.every(r=>r.nf!=null);
 const max=Math.max(...Rs.map(r=>r.aRec),1);
 const al=[...new Set(L.filter(x=>x.mes.startsWith(ano)).map(x=>x.a))].sort((p,q)=>A[p].nome.localeCompare(A[q].nome));
 const dv=dividas(dvEsc==='todos'?null:x=>x.mes.startsWith(ano)&&(!dvMes||x.mes===ano+'-'+dvMes));const dvTot=dv.reduce((s,d)=>s+d.tot,0);
 app.innerHTML=`<div class="bar"><div class="mpick">${['2024','2025','2026'].map(y=>`<button style="width:auto;padding:0 12px;${y===ano?'background:var(--bg);font-weight:700':''}" data-ano="${y}">${y}</button>`).join('')}</div></div>
 <div class="kpis"><div class="kpi"><small>Recebido no ano</small><strong class="pos">${brl(t('rec'))}</strong><em>de ${brl(t('aRec'))}</em></div>
 <div class="kpi"><small>Saldo do ano</small><strong class="${t('pend')?'neg':''}">${brl(-t('pend'))}</strong><em>pendências da competência</em></div>
 <div class="kpi"><small>NFs do João</small><strong>${nfKnown?brl(t('nf')):brl(Rs.reduce((s,r)=>s+(r.nf||0),0))}</strong><em>${nfKnown?ms.length+' meses':'só meses com mensalidade registrada'}</em></div>
 <div class="kpi"><small>Igreja pagou</small><strong>${brl(Rs.reduce((s,r)=>s+(r.igreja||0),0))}</strong><em>NF − reembolsos</em></div></div>
 <h2>Recebido × pendente por mês</h2>
 <div class="chart">${Array.from({length:12},(_,k)=>{const m=ano+'-'+String(k+1).padStart(2,'0');const r=Rs[ms.indexOf(m)];
  return `<div class="col" title="${r?lbl(m)+': recebido '+brl(r.rec)+', pendente '+brl(r.pend):''}">${r?`<i class="p" style="height:${r.pend/max*110}px"></i><i style="height:${r.rec/max*110}px"></i>`:''}<span>${MN[k]}</span></div>`}).join('')}</div>
 <div class="legend" style="margin-top:6px"><span><b style="background:var(--ok)"></b>Recebido</span><span><b style="background:var(--warn)"></b>Pendente</span></div>
 <h2>Quem pagou em ${ano}</h2>
 <div class="grid-wrap"><table><thead><tr><th>Aluno</th>${Array.from({length:12},(_,k)=>`<th style="text-align:center">${MN[k]}</th>`).join('')}</tr></thead><tbody>
 ${al.map(a=>`<tr><td>${A[a].nome}</td>${Array.from({length:12},(_,k)=>{const m=ano+'-'+String(k+1).padStart(2,'0');const x=L.find(y=>y.mes===m&&y.a===a);
  return `<td style="text-align:center">${x?`<span class="cell c-${x.st}" title="${x.st}${x.conta?' · '+x.conta:''}">${x.st==='pago'?(x.conta&&x.conta!=='PagSeguro'?'•':'✓'):x.st==='pendente'?'!':'–'}</span>`:'<span class="cell c-x">·</span>'}</td>`}).join('')}</tr>`).join('')}
 </tbody></table></div>
 <div class="legend" style="margin-top:6px"><span><span class="cell c-pago">✓</span> Pago</span><span><span class="cell c-pago">•</span> Pago fora do PagSeguro</span><span><span class="cell c-pendente">!</span> Pendente</span><span><span class="cell c-isento">–</span> Isento</span></div>
 <h2>Débitos em aberto</h2>
 <div class="bar"><button class="chip ${dvEsc==='ano'?'on':''}" data-dv="ano">Só ${ano}</button><button class="chip ${dvEsc==='todos'?'on':''}" data-dv="todos">Todos os anos</button>${dvEsc==='ano'?`<select id="dvm" aria-label="Mês"><option value="">Ano inteiro</option>${MF.map((n,k)=>{const v=String(k+1).padStart(2,'0');return `<option value="${v}" ${dvMes===v?'selected':''}>${n}</option>`}).join('')}</select>`:''}<b class="neg" style="margin-left:auto">${brl(dvTot)}</b></div>
 <div class="list">${dv.length?'':'<div class="row">Nenhum débito neste período.</div>'}${dv.map(d=>`<div class="row"><div class="who"><b>${A[d.a].nome}</b><small>${d.xs.map(x=>short(x.mes)).join(', ')}</small></div><b class="neg">${brl(d.tot)}</b></div>`).join('')}</div>`}
function vAlunos(){app.innerHTML=`<div class="note">No app real, aluno ativo entra automaticamente no próximo mês aberto. Desativar não apaga o histórico.</div>

function vRel(){const R=resumo(mes);const pagos=R.r.filter(x=>x.st==='pago'),pend=R.r.filter(x=>x.st==='pendente');

 <h3>1 · Nota fiscal</h3>${tb(['Item','Valor'],[`<tr><td>${R.n} alunos × ${brl(P[mes].mens)}</td><td class="num">${brl(P[mes].mens?R.n*P[mes].mens:null)}</td></tr>`,...R.aj.map(j=>`<tr><td>Ajuste: ${j.desc}</td><td class="num">${brl(j.valor)}</td></tr>`),`<tr><td><b>NF final</b></td><td class="num"><b>${brl(R.nf)}</b></td></tr>`])}
 <h3>2 · Divisão</h3>${tb(['Parte','Valor'],[`<tr><td>Reembolso dos alunos esperado (${R.n-R.isent.length} × ${brl(P[mes].aluno)})</td><td class="num">${brl(R.aRec)}</td></tr>`,`<tr><td>Reembolso recebido</td><td class="num">${brl(R.rec)}</td></tr>`,`<tr><td>Parcela da igreja (NF − recebido)</td><td class="num">${brl(R.igreja)}</td></tr>`])}
 <h3>3 · Pagaram (${pagos.length})</h3>${tb(['Aluno','Conta','Valor'],pagos.map(x=>`<tr><td>${A[x.a].nome}</td><td>${x.conta||'não informada'}${x.conta&&x.conta!=='PagSeguro'?' <span class="tag">fora do PagSeguro</span>':''}</td><td class="num">${brl(x.valor)}</td></tr>`))}
 <h3>4 · Não pagaram (${pend.length}) · ${brl(R.pend)}</h3>${tb(['Aluno','Valor'],pend.map(x=>`<tr><td>${A[x.a].nome}</td><td class="num">${brl(x.valor)}</td></tr>`))}
 <h3>5 · Isentos (${R.isent.length})</h3>${tb(['Aluno','Motivo','Igreja cobre'],R.isent.map(x=>`<tr><td>${A[x.a].nome}</td><td>${x.motivo||'—'}</td><td class="num">${brl(P[mes].mens)}</td></tr>`))}
 <h3>6 · Recebidos de meses anteriores</h3>${tb(['Aluno','Competência','Valor'],R.atrasados.map(x=>`<tr><td>${A[x.a].nome}</td><td>${short(x.mes)}</td><td class="num">${brl(x.valor)}</td></tr>`))}
 </div>`}

document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b){tab=b.dataset.t;render()}});
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.mv){const ms=meses();mes=ms[ms.indexOf(mes)+ +d.mv]||mes;render()}
 else if(d.f){filtro=d.f;render()}
 else if(d.set){const[i,s]=d.set.split(':');const x=L[+i];x.st=s;if(s==='pago'){x.conta=x.conta||'PagSeguro';x.pago_em=x.pago_em||HOJE;toast(A[x.a].nome+': pago')}else{x.conta=null;x.pago_em=null}render()}
 else if(d.conta){const[i,c]=d.conta.split(':');L[+i].conta=c;render()}
 else if(d.go){tab=d.go;render()}
 else if(d.ano){ano=d.ano;render()}
 else if(d.dv){dvEsc=d.dv;dvMes='';render()}
 else if(d.at){const a=A[+d.at];a.ativo=!a.ativo;render()}
 else if(b.id==='abrir'){const n=nextM(mes);P[n]={...P[mes]};A.filter(a=>a.ativo).forEach(a=>L.push({mes:n,a:a.id,st:'pendente',conta:null,valor:P[n].aluno,pago_em:null,motivo:''}));mes=n;toast(lbl(n)+' aberto');render()}
 else if(b.id==='pdf'){toast('No app real, salva o relatório em PDF')}});
app.addEventListener('change',e=>{if(e.target.id==='dvm'){dvMes=e.target.value;render()}});
app.addEventListener('input',e=>{if(e.target.dataset.mot)L[+e.target.dataset.mot].motivo=e.target.value});
app.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='fAj'){AJ.push({mes,valor:+$('#ajv').value,desc:$('#ajd').value,aluno:null});toast('Ajuste adicionado')}
 if(e.target.id==='fAl'){A.push({id:A.length,nome:$('#aln').value,apelidos:[],turma:+$('#alt').value,ativo:true});toast('Aluno adicionado')}render()});
render();
